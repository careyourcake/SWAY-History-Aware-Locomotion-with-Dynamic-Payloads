base_config: configs/ppo_b2_payload.yaml
total_timesteps: 100000000
episodes_per_gate: 100
gate: {min_success_rate: 0.8, max_velocity_rmse: 0.45, max_fall_rate: 0.2}
stages:
  - name: c0_locomotion
    stage_timesteps: 25000000
    scenario: unloaded
    environment:
      payload: {mass: [0.0, 0.0], x: [0.0, 0.0], y: [0.0, 0.0], z: [0.2, 0.2]}
      dynamic_payload: {enabled: false, mass: [0.0, 0.0], length: [0.2, 0.2], initial_angle_deg: [0.0, 0.0], initial_velocity: [0.0, 0.0]}
      randomization: {friction: [0.8, 1.1], motor_strength: [0.98, 1.02], kp_scale: [0.98, 1.02], kd_scale: [0.98, 1.02], observation_noise: 0.005, action_delay_probability: 0.0, push_probability: 0.0, push_velocity: 0.0}
  - name: c1_light_swing
    stage_timesteps: 25000000
    scenario: mass_2
    environment:
      dynamic_payload: {enabled: true, mass: [1.0, 2.0], length: [0.2, 0.2], initial_angle_deg: [-3.0, 3.0], initial_velocity: [-0.1, 0.1]}
      randomization: {friction: [0.75, 1.15], motor_strength: [0.97, 1.03], kp_scale: [0.97, 1.03], kd_scale: [0.97, 1.03], observation_noise: 0.008, action_delay_probability: 0.02, push_probability: 0.0, push_velocity: 0.0}
  - name: c2_target_swing
    stage_timesteps: 25000000
    scenario: mass_5
    environment:
      dynamic_payload: {enabled: true, mass: [1.0, 5.0], length: [0.2, 0.2], initial_angle_deg: [-8.0, 8.0], initial_velocity: [-0.5, 0.5]}
      randomization: {friction: [0.65, 1.2], motor_strength: [0.94, 1.06], kp_scale: [0.94, 1.06], kd_scale: [0.94, 1.06], observation_noise: 0.012, action_delay_probability: 0.08, push_probability: 0.006, push_velocity: 0.5}
  - name: c3_robust_swing
    stage_timesteps: 25000000
    scenario: robust_gate
    environment:
      dynamic_payload: {enabled: true, mass: [1.0, 5.0], length: [0.1, 0.5], initial_angle_deg: [-8.0, 8.0], initial_velocity: [-0.5, 0.5]}
      randomization: {friction: [0.5, 1.25], motor_strength: [0.9, 1.1], kp_scale: [0.9, 1.1], kd_scale: [0.9, 1.1], observation_noise: 0.02, action_delay_probability: 0.15, push_probability: 0.015, push_velocity: 0.75}
