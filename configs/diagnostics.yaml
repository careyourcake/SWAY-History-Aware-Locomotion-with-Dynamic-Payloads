    purpose: "internal no-load PPO reference"
  - name: b2_static_load_reference
    config: configs/b2_static.yaml
    purpose: "internal static-load PPO reference"
  - name: b3_dynamic_load_reference
    config: configs/b3_dynamic_mlp.yaml
    purpose: "internal dynamic-load PPO reference"
