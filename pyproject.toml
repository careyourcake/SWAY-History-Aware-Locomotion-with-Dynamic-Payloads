[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2-mjx"
version = "0.2.0"
description = "Payload-randomized Unitree B2 locomotion environment for MuJoCo MJX."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "jax>=0.5.3,<0.8",
  "mujoco>=3.3.0,<3.5",
  "mujoco-mjx>=3.3.0,<3.5",
  "brax>=0.13.0,<0.15",
  "flax>=0.10.4,<0.13",
  "optax>=0.2.4,<0.3",
  "numpy>=1.26,<3",
  "PyYAML>=6.0.2,<7",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<0.7",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.5.3,<0.8"]
dev = ["pytest>=8.3,<10", "pytest-xdist>=3.6,<4"]
plots = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["b2_mjx*"]

[tool.setuptools.package-data]
b2_mjx = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
